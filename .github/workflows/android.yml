name: Android

on:
  push:
    branches: [android]
    paths: ["androidApp/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["androidApp/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Test and build APK
        working-directory: androidApp
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: PhotoAccessibilityStudio-Android
          path: androidApp/app/build/outputs/apk/debug/app-debug.apk
